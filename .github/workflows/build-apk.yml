name: Build CHULU HEALTH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: unzip -o CHULU_HEALTH_ANDROID_PROJECT.zip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: CHULU_HEALTH_ANDROID
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHULU-HEALTH-debug-apk
          path: CHULU_HEALTH_ANDROID/app/build/outputs/apk/debug/app-debug.apk
